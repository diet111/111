<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="饮食记录">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">

<title>增肌减脂 · 饮食记录</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#f3f5f2;color:#17211b;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
:root{
  --bg:#f3f5f2;--card:#ffffff;--ink:#17211b;--muted:#6b7a72;--line:#e7ebe6;
  --green:#17795a;--green-soft:#e4f1ea;--blue:#2f6fd0;--amber:#bf8515;--terra:#bd5f39;--red:#bf4438;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 10px 26px rgba(20,40,30,.045);
}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{background:none;border:0;padding:0}
#app{max-width:480px;margin:0 auto;padding:0 14px 104px;min-height:100vh}

/* top */
.top{padding:18px 2px 10px}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.top h1{margin:0;font-size:21px;letter-spacing:.2px}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.goal-chip{
  background:var(--green-soft);color:var(--green);border-radius:999px;padding:6px 11px;
  font-size:12px;font-weight:600;white-space:nowrap;margin-top:2px
}

/* generic */
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.sec-title{font-size:12.5px;color:var(--muted);letter-spacing:.4px;margin:18px 4px 8px;font-weight:600}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 10px}
.hidden{display:none!important}

/* header card */
.hero{display:flex;align-items:center;gap:14px}
.ring-wrap{position:relative;width:104px;height:104px;flex:0 0 auto}
.ring{width:104px;height:104px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .track{stroke:#edf0ec}
.ring .val{stroke:var(--green);transition:stroke-dasharray .35s ease}
.ring .val.over{stroke:var(--red)}
.ring-center{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  line-height:1.1
}
.ring-center b{font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.ring-center span{font-size:11px;color:var(--muted);margin-top:2px}
.hero-info{flex:1;min-width:0}
.hero-info .k{font-size:12.5px;color:var(--muted)}
.hero-info .big{font-size:17px;font-weight:600;margin:2px 0 6px}
.hero-info .remain{font-size:13px;color:var(--muted)}
.hero-info .remain b{color:var(--ink);font-variant-numeric:tabular-nums}

.macro{margin-top:14px}
.macro-row{margin-bottom:9px}
.macro-row:last-child{margin-bottom:0}
.macro-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px}
.macro-top .v{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:#edf0ec;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.bar i.p{background:var(--blue)}
.bar i.c{background:var(--amber)}
.bar i.f{background:var(--terra)}

/* day switch */
.seg{display:flex;background:#e9ede8;border-radius:12px;padding:3px;margin:0 0 12px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(20,40,30,.1)}

/* date nav */
.datenav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 12px}
.datenav .d{font-size:15px;font-weight:600}
.datenav .d small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.arrow{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);background:#ecefeb}
.arrow:active{background:#e2e6e1}
.today-btn{font-size:12px;color:var(--green);background:var(--green-soft);padding:5px 10px;border-radius:999px;font-weight:600}

/* meals */
.meal{padding:14px 14px 8px}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.meal-head .l{display:flex;align-items:baseline;gap:8px;min-width:0}
.meal-head .n{font-weight:600;font-size:14.5px}
.meal-head .k{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.add-btn{width:30px;height:30px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.add-btn:active{background:#d3e9df}
.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.entry:first-of-type{border-top:0}
.entry .en{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .es{font-size:11.5px;color:var(--muted);margin-top:1px}
.entry .ev{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
.entry .ev small{display:block;font-size:11px;color:var(--muted);text-align:right}

/* bottom nav */
#tabbar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:40
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:#96a29b;font-size:11px;font-weight:500}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--green)}

/* sheet */
.overlay{position:fixed;inset:0;background:rgba(14,24,19,.42);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.overlay[hidden]{display:none}
.sheet{
  background:var(--card);width:100%;max-width:480px;border-radius:22px 22px 0 0;
  max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
  animation:up .24s cubic-bezier(.2,.8,.3,1)
}
.sheet.tall{min-height:64vh}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:translateY(0);opacity:1}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 8px}
.sheet-title{font-weight:600;font-size:15.5px}
.icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted);background:#eff2ee}
.done-btn{font-size:13px;color:var(--green);font-weight:600;background:var(--green-soft);padding:7px 13px;border-radius:10px}
.pick-bar{position:sticky;top:0;background:var(--card);z-index:6;padding:2px 0 8px}
.pick-sum{font-size:12px;color:var(--muted);padding:0 14px 4px}
.sheet-body{overflow:auto;padding:0 14px calc(18px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:7px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;background:#eff2ee;color:var(--muted);font-size:13px;font-weight:500}
.chip.on{background:var(--green);color:#fff}
.chip.custom{background:var(--green-soft);color:var(--green)}

.search{position:relative;margin-bottom:4px}
.search input{
  width:100%;padding:11px 14px 11px 38px;border-radius:12px;border:1px solid var(--line);
  background:#f7f9f6;outline:none;font-size:15px
}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search input:focus{border-color:#bcd9cb;background:#fff}

.food-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left}
.food-row:last-child{border-bottom:0}
.fr-name{font-size:14.5px}
.fr-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.fr-add{width:28px;height:28px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.fr-del{width:26px;height:26px;border-radius:50%;background:#f7ebe8;color:#b4685a;display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto;margin-right:6px}
.fr-actions{display:flex;align-items:center;flex:0 0 auto}
.cat-head{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.5px;padding:14px 2px 6px}

/* portion */
.portion{padding:6px 0 4px}
.p-name{font-size:18px;font-weight:600}
.p-base{font-size:12px;color:var(--muted);margin-top:3px}
.p-input{display:flex;align-items:center;gap:8px;margin:16px 0 10px}
.p-input input{
  flex:1;padding:13px 14px;border-radius:13px;border:1px solid var(--line);background:#f7f9f6;
  font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;outline:none;text-align:center;width:100%
}
.p-input input:focus{border-color:#bcd9cb;background:#fff}
.p-input .u{font-size:14px;color:var(--muted)}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.quick button{padding:7px 12px;border-radius:9px;background:#eff2ee;font-size:12.5px;color:var(--ink)}
.quick button:active{background:#e3e8e2}
.preview{background:#f7f9f6;border-radius:14px;padding:13px 14px;margin-bottom:14px}
.preview .pv-main{display:flex;align-items:baseline;gap:6px}
.preview .pv-main b{font-size:23px;font-variant-numeric:tabular-nums}
.preview .pv-main span{font-size:12px;color:var(--muted)}
.preview .pv-macro{display:flex;gap:14px;margin-top:8px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.primary{
  width:100%;padding:14px;border-radius:14px;background:var(--green);color:#fff;font-weight:600;font-size:15.5px
}
.primary:active{background:#136a4f}
.danger{width:100%;padding:12px;border-radius:14px;background:#fbeae8;color:var(--red);font-weight:600;font-size:14.5px;margin-top:9px}
.form-field{margin-bottom:12px}
.form-field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.form-field input{
  width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:#f7f9f6;
  outline:none;font-size:15px
}
.form-field input:focus{border-color:#bcd9cb;background:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:#23332b;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;
  z-index:90;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:tin .2s ease;max-width:86vw;text-align:center
}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}

/* progress */
.stat-row{display:flex;gap:10px;margin-bottom:12px}
.stat{flex:1;background:var(--card);border-radius:16px;padding:13px 12px;box-shadow:var(--shadow)}
.stat .k{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:19px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11px;font-weight:400;color:var(--muted);margin-left:2px}
.chartbox{padding:10px 6px 4px}
.chartbox svg{width:100%;display:block;overflow:visible}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);padding:2px 6px 6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.week-table{width:100%;border-collapse:collapse;font-size:13px}
.week-table th{font-weight:500;color:var(--muted);font-size:11.5px;padding:3px 2px 7px;text-align:left;border-bottom:1px solid var(--line)}
.week-table th.r{text-align:right}
.week-table td{padding:9px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.week-table tr:last-child td{border-bottom:0}
.week-table .r{text-align:right;color:var(--muted)}
.week-table .d{text-align:right;font-weight:600}
.down{color:var(--green)}
.up{color:var(--terra)}
.goal-hint{margin-top:8px;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.warn{background:#fdf3e3;color:#8a5a12;border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.55;margin:2px 0 10px}

/* me */
.target-card .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.target-card .row:last-child{border-bottom:0}
.target-card .row span{font-size:13.5px;color:var(--muted)}
.target-card input{
  width:92px;text-align:right;padding:7px 9px;border-radius:9px;border:1px solid var(--line);
  background:#f7f9f6;font-size:14.5px;font-variant-numeric:tabular-nums;outline:none
}
.target-card input:focus{border-color:#bcd9cb;background:#fff}
.target-card input[type=date]{width:136px}
.note{font-size:12.5px;color:var(--muted);line-height:1.65}
.note b{color:var(--ink)}
.btn-line{width:100%;padding:13px;border-radius:13px;background:#eff2ee;font-size:14.5px;font-weight:500;margin-bottom:9px}
.btn-line:active{background:#e4e9e3}
</style>
</head>

<div id="overlay" class="overlay" hidden><div class="sheet" id="sheet"></div></div>

const LS_KEY='gaincut.v1';
const clone=function(o){return JSON.parse(JSON.stringify(o));};
const DEFAULT_STATE={
  v:1,
  settings:{
    training:{kcal:2200,p:150,c:265,f:60},
    rest:{kcal:1950,p:150,c:205,f:60},
    startWeight:67,
    goalWeight:61,
    goalDate:'2027-02-01'
  },
  days:{},
  customFoods:[],
  recent:[]
};
let state=loadState();
let currentView='log';

let sheetState=null;
let searchQuery='';
let pickerTab='preset';
let storageOK=true;

function loadState(){
  try{
    var raw=localStorage.getItem(LS_KEY);
    if(!raw) return clone(DEFAULT_STATE);
    return normalize(JSON.parse(raw));
  }catch(e){ storageOK=false; return clone(DEFAULT_STATE); }
}
function normalize(s){
  var out=clone(DEFAULT_STATE);
  if(!s||typeof s!=='object') return out;
  if(s.days&&typeof s.days==='object') out.days=s.days;
  if(Array.isArray(s.customFoods)) out.customFoods=s.customFoods;
  if(Array.isArray(s.recent)) out.recent=s.recent;
  if(s.settings&&typeof s.settings==='object'){
    out.settings=Object.assign(out.settings,s.settings);
    out.settings.training=Object.assign(clone(DEFAULT_STATE.settings.training),s.settings.training||{});
    out.settings.rest=Object.assign(clone(DEFAULT_STATE.settings.rest),s.settings.rest||{});
  }
  if(!out.settings.goalDate) out.settings.goalDate=DEFAULT_STATE.settings.goalDate;
  if(!out.settings.startWeight) out.settings.startWeight=DEFAULT_STATE.settings.startWeight;
  if(!out.settings.goalWeight) out.settings.goalWeight=DEFAULT_STATE.settings.goalWeight;
  return out;
}
function saveState(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(state)); }
  catch(e){ if(storageOK){ storageOK=false; toast('本地存储不可用，请用"导出备份"保存数据'); } }
}

/* ---------------- helpers ---------------- */
function pad(n){return String(n).padStart(2,'0');}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dateOf(k){var a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function todayKey(){return keyOf(new Date());}
function shiftKey(k,n){var d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d);}
function autoType(k){var w=dateOf(k).getDay();return (w===1||w===2||w===4||w===5)?'training':'rest';}
function getDay(k,create){
  var d=state.days[k];
  if(!d&&create){ d={type:autoType(k),meals:{},weight:null}; state.days[k]=d; }
  if(d&&!d.meals) d.meals={};
  return d;
}
function allFoods(){ return FOODS.concat(state.customFoods||[]); }
function findFood(id){ var f=allFoods().filter(function(x){return x.id===id;})[0]; return f||null; }
function dayTotals(day){
  var t={kcal:0,p:0,c:0,f:0,na:0};
  if(!day||!day.meals) return t;
  MEALS.forEach(function(m){
    (day.meals[m.id]||[]).forEach(function(e){
      t.kcal+=e.kcal; t.p+=e.p; t.c+=e.c; t.f+=e.f; t.na+=(e.na||0);
    });
  });
  return t;
}
function targetsOf(day){
  var t=state.settings&&state.settings[day.type];
  return t||(state.settings&&state.settings.training)||DEFAULT_STATE.settings.training;
}
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function r0(v){ return Math.round(v); }
function r1(v){ return Math.round(v*10)/10; }
function fg(v){ var r=Math.round(v*10)/10; return (r%1===0)?String(r):r.toFixed(1); }
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function guessMeal(){
  var h=new Date().getHours()+new Date().getMinutes()/60;
  if(h<10) return 'breakfast';
  if(h<11.5) return 'snack';
  if(h<15) return 'lunch';
  if(h<18) return 'pre';
  if(h<21.5) return 'dinner';
  return 'night';
}

function toast(msg){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.hidden=false;
  clearTimeout(toast._t);
  toast._t=setTimeout(function(){ el.hidden=true; },1900);
}

  catch(e){ return false; }
}

function renderLog(){
  var day=getDay(currentDate,true);
  var t=dayTotals(day);
  var tg=targetsOf(day);
  var T=function(v,min){ var n=parseFloat(v); return (isFinite(n)&&n>=(min||1))?n:(min||1); };
  var tgK=T(tg.kcal,800), tgP=T(tg.p,20), tgC=T(tg.c,20), tgF=T(tg.f,10);
  var isToday=currentDate===todayKey();
  var dow=['周日','周一','周二','周三','周四','周五','周六'][dateOf(currentDate).getDay()];
  var d=dateOf(currentDate);
  var dateLabel=(currentDate===todayKey()?'今天 · ':'')+(d.getMonth()+1)+'月'+d.getDate()+'日';

  var pct=Math.min(t.kcal/tgK,1.15);
  var C=2*Math.PI*52;
  var dash=pct*C;
  var over=t.kcal>tgK;
  var remain=tgK-t.kcal;

  var macros=[
    ['蛋白质',t.p,tgP,'p'],
    ['碳水',t.c,tgC,'c'],
    ['脂肪',t.f,tgF,'f']
  ];
  var macroHTML=macros.map(function(m){
    var w=Math.min(100,m[1]/m[2]*100);
    return '<div class="macro-row"><div class="macro-top"><span>'+m[0]+'</span><span class="v">'+r1(m[1])+' / '+m[2]+' g</span></div>'+
      '<div class="bar"><i class="'+m[3]+'" style="width:'+w+'%"></i></div></div>';
  }).join('');

  var mealsHTML=MEALS.map(function(m){
    var arr=day.meals[m.id]||[];
    var mk=arr.reduce(function(s,e){return s+e.kcal;},0);
    var mp=arr.reduce(function(s,e){return s+e.p;},0);
    var rows=arr.length?arr.map(function(e,i){
      return '<button class="entry" data-act="edit-entry" data-meal="'+m.id+'" data-idx="'+i+'">'+
        '<div style="min-width:0"><div class="en">'+esc(e.name)+'</div><div class="es">'+fg(e.g)+'g · 蛋白 '+r1(e.p)+'g</div></div>'+
        '<div class="ev">'+r0(e.kcal)+'<small>kcal</small></div></button>';
    }).join(''):'';
    return '<div class="card meal"'+(arr.length?'':' style="padding:11px 14px"')+'><div class="meal-head"><div class="l"><span class="n">'+m.name+'</span>'+
      (arr.length?'<span class="k">'+r0(mk)+' kcal · P'+r1(mp)+'</span>':'')+'</div>'+
      '<button class="add-btn" data-act="open-picker" data-meal="'+m.id+'" aria-label="添加'+m.name+'">+</button></div>'+
      '<div>'+rows+'</div></div>';
  }).join('');

  document.getElementById('root').innerHTML=
    '<div class="datenav"><button class="arrow" data-act="date-prev" aria-label="前一天">‹</button>'+
      '<div style="display:flex;align-items:center;gap:8px"><span class="d">'+dateLabel+'<small>'+dow+'</small></span>'+
      (isToday?'':'<button class="today-btn" data-act="date-today">回到今天</button>')+'</div>'+
      '<button class="arrow" data-act="date-next" aria-label="后一天">›</button></div>'+
    '<div class="seg">'+
      '<button class="'+(day.type==='training'?'on':'')+'" data-act="set-type" data-type="training">训练日 '+state.settings.training.kcal+'</button>'+
      '<button class="'+(day.type==='rest'?'on':'')+'" data-act="set-type" data-type="rest">休息日 '+state.settings.rest.kcal+'</button>'+
    '</div>'+
    '<div class="card"><div class="hero">'+
      '<div class="ring-wrap"><svg class="ring" viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"></circle>'+
      '<circle class="val '+(over?'over':'')+'" cx="60" cy="60" r="52" style="stroke-dasharray:'+dash+' '+C+'"></circle></svg>'+
      '<div class="ring-center"><b>'+r0(t.kcal)+'</b><span>/ '+r0(tgK)+' kcal</span></div></div>'+
      '<div class="hero-info"><div class="k">'+(remain>=0?'今日还可摄入':'已超出')+'</div>'+
      '<div class="big">'+Math.abs(r0(remain))+' kcal</div>'+

function weightSeries(){
  return Object.keys(state.days).map(function(k){
    var d=state.days[k];
    return (d&&typeof d.weight==='number'&&d.weight>0)?{key:k,w:d.weight}:null;
  }).filter(Boolean).sort(function(a,b){ return a.key<b.key?-1:1; });
}
function avgTrailing(list,idx,n){
  var s=0,c=0;
  for(var i=Math.max(0,idx-n+1);i<=idx;i++){ s+=list[i].w; c++; }
  return s/c;
}

function drawChart(){
  var box=document.getElementById('chart');
  if(!box) return;
  var series=weightSeries().slice(-30);
  if(series.length<2){ box.innerHTML='<div class="empty">再记录几天就能看到趋势线</div>'; return; }
  var W=340,H=170,PL=34,PR=8,PT=12,PB=24;
  var goal=state.settings.goalWeight;
  var ws=series.map(function(p){return p.w;});
  var mn=Math.min.apply(null,ws), mx=Math.max.apply(null,ws);
  var pad=Math.max(0.35,(mx-mn)*0.25);
  mn-=pad; mx+=pad;
  function X(i){ return PL+(W-PL-PR)*(i/(series.length-1)); }
  function Y(v){ return PT+(H-PT-PB)*(1-(v-mn)/(mx-mn)); }
  var pts=series.map(function(p,i){ return [X(i),Y(p.w)]; });
  var avg=series.map(function(p,i){ return [X(i),Y(avgTrailing(series,i,7))]; });
  var dline='M'+pts.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L');
  var aline='M'+avg.map(function(p){return p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' L');
  var dots=pts.map(function(p,i){ return '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.4" fill="#c3ccc6"></circle>'; }).join('');
  var grid='';
  [0,0.5,1].forEach(function(f){
    var yy=PT+(H-PT-PB)*f;
    grid+='<line x1="'+PL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+yy.toFixed(1)+'" stroke="#edf0ec" stroke-width="1"></line>';
  });
  var labels='<text x="'+(PL-6)+'" y="'+(Y(mx-pad)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#8b978f">'+fg(mx-pad)+'</text>'+
    '<text x="'+(PL-6)+'" y="'+(Y(mn+pad)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="#8b978f">'+fg(mn+pad)+'</text>'+
    '<text x="'+PL+'" y="'+(H-6)+'" font-size="10.5" fill="#8b978f">'+series[0].key.slice(5)+'</text>'+
    '<text x="'+(W-PR)+'" y="'+(H-6)+'" text-anchor="end" font-size="10.5" fill="#8b978f">'+series[series.length-1].key.slice(5)+'</text>';
  var gy=Y(goal);
  var showGoal=(goal>=mn&&goal<=mx);
  var gl=document.getElementById('goalLegend');
  if(gl) gl.style.display=showGoal?'':'none';
  var last=series[series.length-1].w;
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="体重趋势，最近 '+series.length+' 天">'+
    grid+labels+
    (showGoal?'<line x1="'+PL+'" y1="'+gy.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+gy.toFixed(1)+'" stroke="#c98a1e" stroke-width="1.4" stroke-dasharray="5 4"></line>':'')+
    '<path d="'+dline+'" fill="none" stroke="#c3ccc6" stroke-width="1.4" stroke-linejoin="round"></path>'+dots+
    '<path d="'+aline+'" fill="none" stroke="#17795a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path>'+
    '</svg><div class="goal-hint">当前 '+fg(last)+' kg · 距目标 '+fg(Math.max(0,last-goal))+' kg</div>';
}

function weekStartKey(k){
  var d=dateOf(k);
  var dow=(d.getDay()+6)%7;
  d.setDate(d.getDate()-dow);
  return keyOf(d);
}
function renderWeeks(){
  var series=weightSeries();
  var el=document.getElementById('weeks');
  if(!series.length){ el.innerHTML='<div class="empty">还没有体重记录</div>'; return; }
  var map={}, order=[];
  series.forEach(function(p){
    var wk=weekStartKey(p.key);
    if(!map[wk]){ map[wk]={wk:wk,items:[]}; order.push(wk); }
    map[wk].items.push(p.w);
  });
  order.sort();
  var avgOf=function(items){ return items.reduce(function(s,v){return s+v;},0)/items.length; };
  var rows=order.slice(-6).map(function(wk,idx,arr){
    var b=map[wk];
    var avg=avgOf(b.items);
    var prevKey=order[order.indexOf(wk)-1];
    var d=prevKey?avg-avgOf(map[prevKey].items):null;
    var s=dateOf(wk), e=new Date(s); e.setDate(e.getDate()+6);
    var range=(s.getMonth()+1)+'/'+s.getDate()+'–'+(e.getMonth()+1)+'/'+e.getDate();
    var deltaTxt=(d!=null)?((d>0?'+':'')+d.toFixed(1)):'—';
    var isLast=(idx===arr.length-1);
    return '<tr'+(isLast?' style="background:#f7f9f6"':'')+'><td>'+range+(isLast?' <span class="muted">本周</span>':'')+'</td>'+
      '<td class="r">'+b.items.length+' 天</td><td class="r">'+avg.toFixed(1)+' kg</td>'+
      '<td class="d '+(d!=null&&d<0?'down':(d!=null&&d>0?'up':''))+'">'+deltaTxt+'</td></tr>';
  }).join('');
  el.innerHTML='<table class="week-table"><thead><tr><th>周</th><th class="r">记录</th><th class="r">均值</th><th class="r">较上周</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

function pickHay(f){
  var a=(typeof ALIASES!=='undefined'&&ALIASES[f.id])?ALIASES[f.id]:[];
  return (f.name+' '+f.cat+' '+a.join(' ')).toLowerCase();
}
function mealSummary(mealId,dateKey){
  var d=getDay(dateKey,false);
  if(!d||!d.meals) return '';
  var arr=d.meals[mealId]||[];
  if(!arr.length) return '';
  var k=0,p=0;
  arr.forEach(function(e){ k+=e.kcal; p+=e.p; });
  return arr.length+' 样 · '+r0(k)+' kcal · 蛋白 '+r1(p)+'g';
}

function renderPickList(){
  var el=document.getElementById('pickList');
  if(!el) return;

  if(q){
    var list=allFoods().filter(function(f){ return pickHay(f).indexOf(q)>=0; });

    if(!list.length) html='<div class="empty">没找到。<br>点上面的「＋ 新食物」，填个数就能用。</div>';
    list.slice(0,80).forEach(function(f){ html+=foodRow(f); });
  }else if(pickerTab==='preset'){
    html=PRESETS.map(function(p){
      var k=0,pp=0;
      p.items.forEach(function(it){ var f=findFood(it[0]); if(f){ k+=f.kcal*it[1]/100; pp+=f.p*it[1]/100; } });
      return '<button class="food-row" data-act="add-preset" data-pid="'+p.id+'">'+
        '<div style="min-width:0"><div class="fr-name">'+esc(p.name)+'</div><div class="fr-sub">约 '+r0(k)+' kcal · 蛋白 '+r1(pp)+'g</div></div>'+
        '<div class="fr-add">＋</div></button>';
    }).join('');
  }else if(pickerTab==='fav'){
    var ids=state.recent.slice(0,16);
    if(!ids.length) html='<div class="empty">添加过的食物会出现在这里</div>';
    ids.forEach(function(id){ var f=findFood(id); if(f) html+=foodRow(f); });
  }else if(pickerTab==='all'){
    CATS.forEach(function(cat){
      var items=allFoods().filter(function(f){return f.cat===cat;});
      if(!items.length) return;
      html+='<div class="cat-head">'+cat+' · '+items.length+'</div>';
      items.forEach(function(f){ html+=foodRow(f); });
    });
    var cs=allFoods().filter(function(f){return f.cat==='自定义';});

      html+='<div class="cat-head">自定义 · '+cs.length+'</div>';

    var items2=allFoods().filter(function(f){return f.cat===pickerTab;});
    if(!items2.length) html='<div class="empty">这个分类还没有食物</div>';
    items2.forEach(function(f){ html+=foodRow(f); });
  }

  openSheet(
    '<div class="sheet-head"><button class="icon-btn" data-act="close-sheet" aria-label="关闭">✕</button>'+
    '<div class="sheet-title">自定义食物</div><div style="width:34px"></div></div>'+
    '<div class="sheet-body"><div class="portion">'+
      '<div class="form-field"><label>名称</label><input id="cfName" placeholder="例如：食堂红烧鸡腿"></div>'+
      '<div class="grid2"><div class="form-field"><label>热量 kcal /100g</label><input id="cfKcal" type="number" inputmode="decimal" placeholder="200"></div>'+
      '<div class="form-field"><label>蛋白质 g /100g</label><input id="cfP" type="number" inputmode="decimal" placeholder="15"></div></div>'+
      '<div class="grid2"><div class="form-field"><label>碳水 g /100g</label><input id="cfC" type="number" inputmode="decimal" placeholder="10"></div>'+
      '<div class="form-field"><label>脂肪 g /100g</label><input id="cfF" type="number" inputmode="decimal" placeholder="8"></div></div>'+
      '<div class="form-field"><label>常见一份多少克（可留空）</label><input id="cfPortion" type="number" inputmode="decimal" placeholder="200"></div>'+
      '<button class="primary" data-act="save-custom">保存到食材库</button>'+
    '</div></div>'
  );
}

/* ---------------- actions ---------------- */
function addEntry(mealId,dateKey,food,grams){
  var d=getDay(dateKey,true);
  if(!d.meals[mealId]) d.meals[mealId]=[];
  var g=Math.max(1,Math.round(grams*10)/10);
  d.meals[mealId].push({
    uid:uid(),fid:food.id,name:food.name,g:g,
    kcal:food.kcal*g/100,p:food.p*g/100,c:food.c*g/100,f:food.f*g/100,na:(food.na||0)*g/100
  });
  state.recent=[food.id].concat(state.recent.filter(function(x){return x!==food.id;})).slice(0,20);
  saveState();
}

document.addEventListener('click',function(ev){
  var el=ev.target.closest('[data-act]');
  if(!el) return;
  var act=el.dataset.act;

  if(act==='view'){
    currentView=el.dataset.view;
    if(currentView==='lib') searchQuery='';
    render();
    window.scrollTo(0,0);
    return;
  }
  if(act==='date-prev'){ currentDate=shiftKey(currentDate,-1); renderLog(); return; }
  if(act==='date-next'){ currentDate=shiftKey(currentDate,1); renderLog(); return; }
  if(act==='date-today'){ currentDate=todayKey(); renderLog(); return; }
  if(act==='set-type'){
    var d=getDay(currentDate,true); d.type=el.dataset.type; saveState(); renderLog(); return;
  }
  if(act==='open-picker'){ openPicker(el.dataset.meal); return; }
  if(act==='close-sheet'){ closeSheet(); return; }
  if(act==='ptab'){
    pickerTab=el.dataset.tab;
    var tabs=document.getElementById('tabs');
    if(tabs){ Array.prototype.forEach.call(tabs.querySelectorAll('[data-tab]'),function(b){ b.classList.toggle('on',b.dataset.tab===pickerTab); }); }
    searchQuery='';
    var si=document.getElementById('pickSearch'); if(si) si.value='';
    renderPickList();
    return;
  }
  if(act==='pick-food'){
    var f=findFood(el.dataset.fid);
    if(f){ if(sheetState) sheetState.from='pick'; openPortion(f,null); }
    return;
  }
  if(act==='back-picker'){
    if(sheetState&&sheetState.meal) openPicker(sheetState.meal,true,sheetState.date);
    else closeSheet();
    return;
  }
  if(act==='done-picker'){
    closeSheet(); currentView='log'; render();
    return;
  }
  if(act==='set-g'){
    var gi=document.getElementById('grams');
    if(gi){ gi.value=el.dataset.g; gi.dispatchEvent(new Event('input')); }
    return;
  }
  if(act==='confirm-portion'){
    var gg=parseFloat(document.getElementById('grams').value)||0;
    if(gg<=0){ toast('请输入克数'); return; }
    var st=sheetState;
    var addedName=st.food.name;
    if(st.entryIdx!=null){
      var dd=getDay(st.date,true);
      var e=(dd.meals[st.meal]||[])[st.entryIdx];
      if(e){
        e.g=Math.round(gg*10)/10;
        e.kcal=st.food.kcal*e.g/100; e.p=st.food.p*e.g/100; e.c=st.food.c*e.g/100; e.f=st.food.f*e.g/100;
        e.na=(st.food.na||0)*e.g/100;
      }
      saveState();
    }else{
      addEntry(st.meal,st.date,st.food,gg);
    }
    if(st.from==='pick'){
      openPicker(st.meal,true,st.date);
      toast('已添加 '+addedName+' '+fg(gg)+'g');
    }else{
      closeSheet();
      currentDate=st.date||currentDate;
      currentView='log';
      render();
      toast('已记录');
    }
    return;
  }
  if(act==='delete-entry'){
    var s=sheetState;
    var day=getDay(s.date,true);
    var arr=day.meals[s.meal]||[];
    arr.splice(s.entryIdx,1);
    saveState(); closeSheet(); renderLog(); toast('已删除');
    return;
  }
  if(act==='edit-entry'){
    var mealId=el.dataset.meal, idx=parseInt(el.dataset.idx,10);
    var d2=getDay(currentDate,true);
    var en=(d2.meals[mealId]||[])[idx];
    if(!en) return;
    var fo=findFood(en.fid);
    if(!fo) fo={id:en.fid||'x',name:en.name,kcal:en.kcal/en.g*100,p:en.p/en.g*100,c:en.c/en.g*100,f:en.f/en.g*100,na:(en.na||0)/en.g*100,portions:[]};
    sheetState={mode:'portion',meal:mealId,date:currentDate,food:fo,entryIdx:idx};
    openPortion(fo,idx);
    return;
  }
  if(act==='add-preset'){
    var p=PRESETS.filter(function(x){return x.id===el.dataset.pid;})[0];
    if(!p) return;
    p.items.forEach(function(it){
      var ff=findFood(it[0]);
      if(ff) addEntry(sheetState.meal,sheetState.date,ff,it[1]);
    });
    var mname=MEALS.filter(function(x){return x.id===sheetState.meal;})[0];
    closeSheet(); currentView='log'; render(); toast('已加入「'+(mname?mname.name:'')+'」');
    return;
  }
  if(act==='lib-add'){
    var lf=findFood(el.dataset.fid);
    if(!lf) return;
    sheetState={mode:'portion',meal:guessMeal(),date:todayKey(),food:lf,entryIdx:null,fromLib:true};
    openPortion(lf,null);
    return;
  }
  if(act==='custom-food'){ openCustomFood(!!sheetState); return; }
  if(act==='del-custom'){
    var cfid=el.dataset.fid;
    if(confirm('从食材库删除这个自定义食物？已记录的餐次不受影响。')){
      state.customFoods=(state.customFoods||[]).filter(function(x){return x.id!==cfid;});
      saveState(); renderLibList(); toast('已删除');
    }
    return;
  }
  if(act==='save-custom'){
    var name=document.getElementById('cfName').value.trim();
    var k=parseFloat(document.getElementById('cfKcal').value);
    var p2=parseFloat(document.getElementById('cfP').value)||0;
    var c2=parseFloat(document.getElementById('cfC').value)||0;
    var f2=parseFloat(document.getElementById('cfF').value)||0;
    var port=parseFloat(document.getElementById('cfPortion').value)||100;
    if(!name||!isFinite(k)){ toast('至少要填名称和热量'); return; }
    var nf={id:'c_'+uid(),name:name,cat:'自定义',kcal:k,p:p2,c:c2,f:f2,na:0,portions:[['1份',port]],custom:true};
    state.customFoods.push(nf);
    saveState();
    if(sheetState&&sheetState.customFromPick&&sheetState.meal){ sheetState.from='pick'; openPortion(nf,null); }
    else{ closeSheet(); render(); toast('已添加到食材库'); }
    return;
  }
  if(act==='export'){
    var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='diet-backup-'+todayKey()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
    toast('已导出备份');
    return;
  }
  if(act==='copy'){
    var txt=JSON.stringify(state);
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){toast('已复制，可粘贴到备忘录');},function(){toast('复制失败');});
    }else{ toast('这个浏览器不支持复制'); }
    return;
  }
  if(act==='import'){
    var inp=document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json';
    inp.onchange=function(){
      var file=inp.files[0]; if(!file) return;
      var rd=new FileReader();
      rd.onload=function(){
        try{
          var obj=JSON.parse(rd.result);
          if(!obj||typeof obj!=='object'||!obj.days) throw new Error('bad');
          state=normalize(obj);
          saveState(); render(); toast('导入成功');
        }catch(e){ toast('文件格式不对'); }
      };
      rd.readAsText(file);
    };
    inp.click();
    return;
  }
  if(act==='reset'){
    if(confirm('确定清空所有记录？建议先导出备份。')){
      state=clone(DEFAULT_STATE); saveState(); render(); toast('已清空');
    }
    return;
  }
});

document.addEventListener('change',function(ev){
  var el=ev.target.closest('[data-save]');
  if(!el) return;
  var path=el.dataset.save.split('.');
  var obj=state.settings;
  for(var i=0;i<path.length-1;i++){ obj=obj[path[i]]; }
  var k=path[path.length-1];
  obj[k]=(el.type==='date')?el.value:(parseFloat(el.value)||0);
  saveState();
  toast('已保存');
});

document.getElementById('overlay').addEventListener('click',function(ev){
  if(ev.target===this) closeSheet();
});

/* ---------------- boot ---------------- */
function render(){
  renderTop();
  renderTabbar();
  if(currentView==='log') renderLog();
  else if(currentView==='lib') renderLib();
  else if(currentView==='progress') renderProgress();
  else renderMe();
}
var bootView=(location.hash||'').replace('#','');
if(['log','lib','progress','me'].indexOf(bootView)>=0) currentView=bootView;
storageOK=storageTest()&&storageOK;
render();
</script>

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
